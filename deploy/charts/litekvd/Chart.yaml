apiVersion: v2
name: litekvd
description: A key-value store served over HTTP, with a leader and read replicas.
type: application

# Both are set from the tag when the release workflow packages this, so that a
# published chart cannot install an image from six months ago. What is written
# here is what `helm install ./deploy/charts/litekvd` uses, which is the
# development path — keep it on the last release rather than ahead of it, since
# image.tag is empty by default and takes appVersion.
version: 1.0.2
appVersion: "1.0.2"

home: https://github.com/tillknuesting/litekvd
sources:
  - https://github.com/tillknuesting/litekvd
  - https://github.com/tillknuesting/litekv
keywords:
  - key-value
  - database
  - storage
maintainers:
  - name: tillknuesting
    url: https://github.com/tillknuesting
