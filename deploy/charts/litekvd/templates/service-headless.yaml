apiVersion: v1
kind: Service
metadata:
  name: {{ include "litekvd.fullname" . }}-headless
  labels: {{- include "litekvd.labels" . | nindent 4 }}
spec:
  # Headless: this exists to give every pod a stable DNS name of its own —
  # <pod>.<this service>.<namespace>.svc — which is what a StatefulSet needs and
  # what lets a follower be pointed at one particular node when that is wanted.
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "litekvd.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
