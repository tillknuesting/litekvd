{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litekvd.fullname" . }}-token
  labels: {{- include "litekvd.labels" . | nindent 4 }}
  annotations:
    # Kept across upgrades. Without this, a helm upgrade with no explicit token
    # would generate a new one, the pods would restart with it, and every
    # client still holding the old one would start getting 401s.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.auth.token }}
  token: {{ .Values.auth.token | b64enc | quote }}
  {{- else }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-token" (include "litekvd.fullname" .)) }}
  {{- if $existing }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
