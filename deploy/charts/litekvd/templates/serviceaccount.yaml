{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "litekvd.serviceAccountName" . }}
  labels: {{- include "litekvd.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# litekvd asks the API server nothing, so this account exists to be an identity
# rather than to hold permissions. There is no Role and no RoleBinding, and a
# token mounted into the pod would be a credential it has no use for.
automountServiceAccountToken: false
{{- end }}
