apiVersion: v1
kind: Service
metadata:
  name: {{ include "litekvd.fullname" . }}-leader
  labels: {{- include "litekvd.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # Writes go here, and so does every follower's -leader.
  #
  # It selects one pod BY NAME, using the label Kubernetes puts on every
  # StatefulSet pod itself. Promotion is a patch of this selector, and every
  # follower comes with it because a follower's -leader is this Service rather
  # than a pod.
  #
  # By name and not by a role label, because a label can be on two pods at once
  # and this must never route to two. It did: a promotion moved the label to a
  # replica, the old leader's node came back, its StatefulSet recreated it with
  # the template's own role label, and both were in this Service — one taking
  # writes it had been superseded out of, the other taking writes for real,
  # neither aware of the other. A pod name has room for one answer.
  selector:
    {{- include "litekvd.selectorLabels" . | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ .Values.leaderPodName | default (printf "%s-0" (include "litekvd.fullname" .)) }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
