apiVersion: v1
kind: Service
metadata:
  name: {{ include "litekvd.fullname" . }}-leader
  labels: {{- include "litekvd.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # Writes go here, and so does every follower's -leader.
  #
  # The selector carries the role, which is what makes a promotion possible
  # without reinstalling anything: move the label and this Service, and every
  # follower through it, is pointing somewhere else. It is also why the label is
  # not in litekvd.selectorLabels — a Service that selected on those would catch
  # the replicas too and send writes to nodes that answer 409.
  selector:
    {{- include "litekvd.selectorLabels" . | nindent 4 }}
    litekv.io/role: leader
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
